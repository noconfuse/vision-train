                    hsv_s: parseFloat(document.getElementById('s2HSV_S').value||''),
                    hsv_v: parseFloat(document.getElementById('s2HSV_V').value||''),
                    augment: document.getElementById('s2Augment').checked
                };
                const s2Path = document.getElementById('s2DatasetPath').value||'';
                const body = { project_path: currentProject.path, dataset_name: selectedDataset.name, dataset_path: selectedDataset.path, model_name: selectedModel, stage1_config: s1, stage2_config: s2, stage2_dataset_path: s2Path };
                const res = await fetch('/api/training/start_two_stage', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
                const data = await res.json();
                document.getElementById('twoStageMsg').textContent = data.success ? ('已启动: '+data.training_id) : ('失败: '+(data.error||''));
                if (data.success){ startTrainingStatusUpdate(); }
            }catch(e){ console.error('启动两阶段失败', e); document.getElementById('twoStageMsg').textContent = '启动失败'; }
        }

        async function stopTraining() {
            try {
                const response = await fetch('/api/training/stop', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                const result = await response.json();

                if (result.success) {
                    document.getElementById('startTrainingBtn').classList.remove('hidden');
                    document.getElementById('stopTrainingBtn').classList.add('hidden');
                    stopTrainingStatusUpdate();
                }
            } catch (error) {
                console.error('停止训练错误:', error);
            }
        }

        function startTrainingStatusUpdate() {
            trainingUpdateInterval = setInterval(updateTrainingStatus, 1000);
        }

        function stopTrainingStatusUpdate() {
            if (trainingUpdateInterval) {
                clearInterval(trainingUpdateInterval);
                trainingUpdateInterval = null;
            }
        }

        async function updateTrainingStatus() {
            try {
                const response = await fetch('/api/training/status');
                const result = await response.json();

                if (result.success) {
                    const status = result.status;

                    document.getElementById('trainingStatusText').textContent = status.message;
                    document.getElementById('trainingProgressBar').style.width = status.progress + '%';
                    document.getElementById('trainingProgressText').textContent = status.progress + '%';
                    // 如果正在下载权重，提示loading
                    if (status.is_running && status.message && status.message.includes('下载预训练模型')) {
                        document.getElementById('trainingStatusText').textContent = '正在下载预训练模型...';
                    }

                    if (!status.is_running && status.progress === 100) {
                        document.getElementById('startTrainingBtn').classList.remove('hidden');
                        document.getElementById('stopTrainingBtn').classList.add('hidden');
                        stopTrainingStatusUpdate();
                        // 加载训练产物
                        loadArtifacts();
                        alert('训练完成！');
                    }
                }
            } catch (error) {
                console.error('更新训练状态错误:', error);
            }
        }

        async function loadArtifacts() {
            try {
                const ridEl = document.getElementById('runSelector');
                const rid = ridEl && ridEl.value ? ridEl.value : '';
                const url = rid ? `/api/training/artifacts?project_path=${encodeURIComponent(currentProject.path)}&training_id=${encodeURIComponent(rid)}` : `/api/training/artifacts?project_path=${encodeURIComponent(currentProject.path)}`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.success) {
                    const metrics = data.metrics || {};
                    document.getElementById('metricsSummary').textContent = formatMetricsText(metrics);
                    const images = [];
                    const a = data.artifacts || {};
                    ['results_png', 'confusion_matrix', 'pr_curve', 'f1_curve'].forEach(k => {
                        if (a[k]) images.push(a[k]);
                    });
                    (a.val_batch_images || []).forEach(p => images.push(p));
                    renderArtifactImages(images);
                    const best = a.weights_best || '';
                    const last = a.weights_last || '';
                    const bsz = a.best_size_bytes || 0;
                    const lsz = a.last_size_bytes || 0;
                    const html = [
                        best ? `<div>最佳模型: <a href="${best}" download>下载</a>（${formatSize(bsz)}）</div>` : '',
                        last ? `<div>最后模型: <a href="${last}" download>下载</a>（${formatSize(lsz)}）</div>` : ''
                    ].filter(Boolean).join('');
                    document.getElementById('trainingDownload').innerHTML = html || '<div style="color:#6c757d;">暂无可下载模型</div>';
                }
            } catch (e) {
                console.error('加载产物失败', e);
            }
        }

        async function startExport() {
            if (!currentProject) { alert('请先选择项目'); return; }
            const trainingId = document.getElementById('runSelector').value;
            if (!trainingId) { alert('请选择来源训练版本'); return; }
            await diagnoseDataset(trainingId);
            const format = document.getElementById('exportFormat').value;
            const half = document.getElementById('exportHalf').checked;
            const int8 = document.getElementById('exportInt8').checked;
            const imgsz = parseInt(document.getElementById('exportImgsz').value || '0', 10) || null;
            const perClass = parseInt(document.getElementById('exportPerClass').value || '20', 10);
            const maxImages = parseInt(document.getElementById('exportMaxImages').value || '200', 10);
            try {
                const res = await fetch('/api/model/export', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ project_path: currentProject.path, training_id: trainingId, format, half_precision: half, int8_quant: int8, imgsz, per_class: perClass, max_images: maxImages })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('exportStatusText').textContent = '导出任务已启动...';
                    pollExportStatus();
                } else {
                    alert('导出启动失败: ' + (data.error || '未知错误'));
                }
            } catch (e) { console.error('导出错误', e); alert('导出失败'); }
        }

        async function diagnoseDataset(trainingId) {
            try {
                const res = await fetch(`/api/dataset/diagnose?project_path=${encodeURIComponent(currentProject.path)}&training_id=${encodeURIComponent(trainingId)}`);
                const data = await res.json();
                if (data.success) {
                    const d = data.diagnose || {};
                    const msg = data.message || '';
                    const lines = [];
                    if (d.dataset_yaml) lines.push(`dataset_yaml: ${d.dataset_yaml}`);
                    if (d.images_train) lines.push(`images/train: ${d.images_train} (${d.exists_images_train ? '存在' : '缺失'})`);
                    if (d.labels_train) lines.push(`labels/train: ${d.labels_train} (${d.exists_labels_train ? '存在' : '缺失'})`);
                    if (msg) lines.push(msg);
                    document.getElementById('diagnoseInfo').innerText = lines.join('\n');
                    if (!d.exists_images_train) throw new Error('缺少 images/train');
                }
            } catch (e) {
                document.getElementById('diagnoseInfo').innerText = '诊断失败：' + (e.message || '');
                throw e;
            }
        }

        async function pollExportStatus() {
            try {
                const res = await fetch('/api/model/export/status');
                const data = await res.json();
                if (data.success) {
                    const st = data.status || {};
                    document.getElementById('exportStatusText').textContent = (st.message || '') + (st.progress ? (' ' + st.progress + '%') : '');
                    if (!st.is_running) { 
                        const rid = document.getElementById('runSelector').value;
                        await listExports(rid); 
                    } else { 
                        setTimeout(pollExportStatus, 1000); 
                    }
                }
            } catch (e) { console.error('导出状态错误', e); }
        }

        async function listExports(trainingId) {
            try {
                if (!trainingId) trainingId = document.getElementById('runSelector').value;
                if (!trainingId) return;

                const url = `/api/model/exports?project_path=${encodeURIComponent(currentProject.path)}&training_id=${encodeURIComponent(trainingId)}`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.success) {
                    const items = (data.exports || []).sort((a,b)=> (b.ts||'').localeCompare(a.ts||''));
                    if (items.length === 0) {
                        document.getElementById('exportList').innerHTML = '<div style="color:#6c757d;">暂无导出产物</div>';
                        return;
                    }
                    const it = items[0]; // Show latest
                    const links = it.files.map(f => {
                        const fname = f.split('path=')[1].split('/').pop();
                        return `<a href="${f}" download>${fname}</a>`;
                    }).join(' | ');
                    
                    const totalSize = it.total_size_bytes ? `（总大小: ${formatSize(it.total_size_bytes)}）` : '';
                    
                    let primaryHtml = '<div style="color:#6c757d;">主模型未识别</div>';
                    if (it.primary_model_path) {
                        const pName = basename(it.primary_model_path);
                        const pUrl = `/api/file?path=${it.primary_model_path}`;
                        primaryHtml = `
                            <div style="margin-bottom:8px;">
                                <a href="${pUrl}" class="btn btn-sm btn-success" download>⬇️ 下载模型文件 (${pName})</a>
                            </div>
                        `;
                    }

                    const netron = `<a href="https://netron.app" target="_blank">可视化(Netron)</a>`;
                    
                    document.getElementById('exportList').innerHTML = `
                        <div style="background:#f0fff4; border:1px solid #48bb78; border-radius:6px; padding:10px;">
                            <div style="font-weight:bold; color:#2f855a; margin-bottom:5px;">✅ 最新导出 (${it.format})</div>
                            ${primaryHtml}
                            <div style="font-size:12px; color:#555;">
                                <div>导出目录: ${it.export_dir} ${totalSize}</div>
                                <div style="margin-top:4px;">所有文件: ${links} | ${netron}</div>
                            </div>
                        </div>
                    `;
                }
            } catch (e) { console.error('列出导出失败', e); }
        }

        function formatSize(bytes) {
            const units = ['B','KB','MB','GB'];
            let v = bytes; let i = 0;
            while (v >= 1024 && i < units.length-1) { v /= 1024; i++; }
            return `${v.toFixed(2)} ${units[i]}`;
        }
        function basename(p) { try { return p.split('/').pop(); } catch { return p; } }

        async function downloadRawWeights() {
            try {
                const url = `/api/training/artifacts?project_path=${encodeURIComponent(currentProject.path)}`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.success) {
                    const a = data.artifacts || {};
                    const files = [];
                    if (a.weights_best) files.push(a.weights_best);
                    if (a.weights_last) files.push(a.weights_last);
                    files.forEach(url => {
                        if (!url) return;
                        const link = document.createElement('a');
                        link.href = url; link.download = '';
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    });
                }
            } catch (e) { console.error('下载原模型失败', e); }
        }

        function renderArtifactImages(images) {
            document.getElementById('artifactsImages').innerHTML = images.map(src => `
                <div style="background:#fff; border:1px solid #e0e0e0; border-radius:8px; padding:8px;">
                    <img src="${src}" style="width:100%; border-radius:6px; cursor: zoom-in;" onclick="openImageModal('${src}')" />
                </div>
            `).join('');
        }

        function formatMetricsText(m) {
            const pick = (keys) => {
                for (const k of keys) { if (m[k] !== undefined) return Number(m[k]); }
                return null;
            };
            const map50 = pick(['map50', 'metrics/mAP50', 'metrics/mAP50(B)', 'mAP50']);
            const map5095 = pick(['map', 'map50_95', 'metrics/mAP50-95', 'metrics/mAP50-95(B)', 'mAP50_95']);
            const precision = pick(['precision', 'metrics/precision', 'metrics/precision(B)']);
            const recall = pick(['recall', 'metrics/recall', 'metrics/recall(B)']);
            if (map50 != null || map5095 != null || precision != null || recall != null) {
                const parts = [];
                if (map50 != null) parts.push(`mAP@0.5: ${map50.toFixed(4)}`);
                if (map5095 != null) parts.push(`mAP@0.5:0.95: ${map5095.toFixed(4)}`);
                if (precision != null) parts.push(`P: ${precision.toFixed(4)}`);
                if (recall != null) parts.push(`R: ${recall.toFixed(4)}`);
                return parts.join(' | ');
            }
            return '暂无指标';
        }

        function autoDownloadLatestExport() {
            fetch(`/api/model/exports?project_path=${encodeURIComponent(currentProject.path)}`)
                .then(res => res.json())
                .then(data => {
                    if (!data.success) return;
                    const items = data.exports || [];
                    if (!items.length) return;
                    const latest = items[items.length - 1];
                    (latest.files || []).forEach(url => {
                        const a = document.createElement('a');
                        a.href = url; a.download = '';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                    });
                });
        }

        async function startEvaluate(split) {
            try {
                document.getElementById('evalStatusText').textContent = '评估启动...';
                document.getElementById('evalProgressBar').style.width = '0%';
                // 尝试使用异步评估接口
                const startRes = await fetch('/api/model/evaluate/start', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ project_path: currentProject.path, split })
                });
                if (startRes.ok) {
                    pollEvaluateStatus();
                } else {
                    // 回退同步
                    await evaluateFallback(split);
                }
            } catch (e) {
                console.warn('异步评估不可用，回退同步', e);
                await evaluateFallback(split);
            }
        }

        async function pollEvaluateStatus() {
            try {
                const res = await fetch('/api/model/evaluate/status');
                const data = await res.json();
                if (data.success) {
                    const st = data.status || {};
                    const pct = st.progress || 0;
                    document.getElementById('evalStatusText').textContent = st.message || '';
                    document.getElementById('evalProgressBar').style.width = pct + '%';
                    if (!st.is_running) {
                        if (st.results && st.results.metrics) {
                            const m = st.results.metrics;
                            document.getElementById('metricsSummary').textContent = formatMetricsText(m);
                        }
                        loadArtifacts();
                    } else {
                        setTimeout(pollEvaluateStatus, 1000);
                    }
                }
            } catch (e) { console.error('评估状态错误', e); }
        }

        async function evaluateFallback(split) {
            try {
                document.getElementById('evalStatusText').textContent = '评估执行中...';
                const res = await fetch('/api/model/evaluate', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ project_path: currentProject.path, split })
                });
                const data = await res.json();
                if (data.success) {
                    const m = data.metrics || {};
                    document.getElementById('metricsSummary').textContent = formatMetricsText(m);
                    const images = (data.images || []);
                    renderArtifactImages(images);
                    document.getElementById('evalStatusText').textContent = '评估完成';
                    document.getElementById('evalProgressBar').style.width = '100%';
                } else {
                    alert('评估失败: ' + (data.error || '未知错误'));
                    document.getElementById('evalStatusText').textContent = '评估失败';
                }
            } catch (e) {
                console.error('评估错误', e);
                alert('评估失败');
                document.getElementById('evalStatusText').textContent = '评估失败';
            }
        }

        async function continueTraining(useBest) {
            if (!currentProject) {
                alert('请先选择项目');
                return;
            }
            try {
                const res = await fetch('/api/training/continue', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        project_path: currentProject.path, 
                        dataset_name: selectedDataset ? selectedDataset.name : 'training', 
                        use_best: useBest, 
                        training_config: {} 
                    })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('startTrainingBtn').classList.add('hidden');
                    document.getElementById('stopTrainingBtn').classList.remove('hidden');
                    startTrainingStatusUpdate();
                } else {
                    alert('继续训练失败: ' + (data.error || '未知错误'));
                }
            } catch (e) {
                console.error('继续训练错误', e);
                alert('继续训练失败');
            }
        }

        async function resumeTraining() {
            if (!currentProject) {
                alert('请先选择项目');
                return;
            }
            try {
                const res = await fetch('/api/training/resume', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        project_path: currentProject.path, 
                        dataset_name: selectedDataset ? selectedDataset.name : 'training'
                    })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('startTrainingBtn').classList.add('hidden');
                    document.getElementById('stopTrainingBtn').classList.remove('hidden');
                    startTrainingStatusUpdate();
                } else {
                    alert('续跑失败: ' + (data.error || '未知错误'));
                }
            } catch (e) {
                console.error('续跑错误', e);
                alert('续跑失败');
            }
        }

        window.addEventListener('beforeunload', function () {
            stopTrainingStatusUpdate();
        });
    </script>

    <!-- Split Dataset Modal -->
    <div id="splitDatasetModal" class="modal-overlay hidden" style="z-index: 10002;">
        <div class="modal-content" style="max-width: 500px; padding: 24px;">
            <div class="modal-header">
                <h3>✂️ 分割数据集</h3>
                <button class="close-btn" onclick="closeSplitDatasetModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div style="margin-bottom: 20px;">
                    <label class="form-label">数据集名称</label>
                    <input type="text" class="form-input" id="splitDatasetName" readonly disabled style="background: #f7fafc;">
                </div>
                
                <div style="margin-bottom: 24px;">
                    <label class="form-label">分割策略 (训练集 : 验证集 : 测试集)</label>
                    
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                        <input type="range" id="splitSlider" min="0" max="100" value="80" style="flex: 1;" oninput="updateSplitLabels()">
                    </div>
                    
                    <div style="display: flex; justify-content: space-between; font-size: 14px; color: #4a5568;">
                        <div>
                            <span style="display: inline-block; width: 12px; height: 12px; background: #48bb78; border-radius: 2px;"></span>
                            训练集: <span id="trainSplitLabel">80%</span>
                        </div>
                        <div>
                            <span style="display: inline-block; width: 12px; height: 12px; background: #ecc94b; border-radius: 2px;"></span>
                            验证集: <span id="valSplitLabel">20%</span>
                        </div>
                        <div>
                            <span style="display: inline-block; width: 12px; height: 12px; background: #4299e1; border-radius: 2px;"></span>
                            测试集: <span id="testSplitLabel">0%</span>
                        </div>
                    </div>
                    
                    <div style="margin-top: 10px; display: flex; gap: 10px; align-items: center;">
                        <input type="checkbox" id="enableTestSplit" onchange="updateSplitLabels()">
                        <label for="enableTestSplit">包含测试集 (固定 10%)</label>
                    </div>
                </div>
                
                <div class="modal-actions" style="justify-content: flex-end;">
                    <button class="btn btn-secondary" onclick="closeSplitDatasetModal()">取消</button>
                    <button class="btn btn-primary" onclick="confirmSplitDataset()">确认分割</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let splitTargetDataset = '';
        
        function openSplitDatasetModal(dsName) {
            splitTargetDataset = dsName;
            document.getElementById('splitDatasetName').value = dsName;
            document.getElementById('splitDatasetModal').classList.remove('hidden');
            document.getElementById('splitDatasetModal').style.display = 'flex';
            updateSplitLabels();
        }
        
        function closeSplitDatasetModal() {
            document.getElementById('splitDatasetModal').classList.add('hidden');
            document.getElementById('splitDatasetModal').style.display = 'none';
        }
        
        function updateSplitLabels() {
            const slider = document.getElementById('splitSlider');
            const enableTest = document.getElementById('enableTestSplit').checked;
            
            let val = parseInt(slider.value);
            let test = enableTest ? 10 : 0;
            
            // Adjust slider logic: slider controls Train %
            // Max train % is 100 - test
            
            let maxTrain = 100 - test;
            if (val > maxTrain) {
                val = maxTrain;
                slider.value = val;
            }
            
            let trainPct = val;
            let testPct = test;
            let valPct = 100 - trainPct - testPct;
            
            if (valPct < 0) {
                // This shouldn't happen if we cap val, but just in case
                valPct = 0;
                trainPct = 100 - testPct;
            }
            
            document.getElementById('trainSplitLabel').textContent = trainPct + '%';
            document.getElementById('valSplitLabel').textContent = valPct + '%';
            document.getElementById('testSplitLabel').textContent = testPct + '%';
        }
        
        async function confirmSplitDataset() {
            if (!confirm('确定要重新分割数据集吗？\n这将打乱并重新分配所有图片和标签，且不可撤销！')) return;
            
            const trainPct = parseInt(document.getElementById('trainSplitLabel').textContent);
            const valPct = parseInt(document.getElementById('valSplitLabel').textContent);
            const testPct = parseInt(document.getElementById('testSplitLabel').textContent);
            
            try {
                const res = await fetch('/api/dataset/split', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        project_path: currentProject.path,
                        dataset_name: splitTargetDataset,
                        val_ratio: valPct / 100,
                        test_ratio: testPct / 100
                    })
                });
                
                const data = await res.json();
                if (data.success) {
                    alert(`分割成功！\n训练集: ${data.counts.train}\n验证集: ${data.counts.val}\n测试集: ${data.counts.test}`);
                    closeSplitDatasetModal();
                    loadProjectDetails();
                } else {
                    alert('分割失败: ' + (data.error || '未知错误'));
                }
            } catch(e) {
                console.error('分割请求失败', e);
                alert('请求失败');
            }
        }
    </script>
