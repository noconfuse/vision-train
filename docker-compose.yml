version: '3.8'

services:
  dataset-tool:
    build: .
    image: dataset-tool:latest
    container_name: vision-train-backend
    ports:
      - "5001:5001"
    volumes:
      # Mount local projects directory to container
      - ./projects:/app/projects
      # Mount pretrained models directory
      - ./pretrained_models:/app/pretrained_models
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    # Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  frontend:
    build: ./frontend
    image: dataset-tool-frontend:latest
    container_name: vision-train-frontend
    ports:
      - "8080:80"
    depends_on:
      - dataset-tool
    restart: unless-stopped
